<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Appointment Confirmation</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#ecfdf5;
 font-family:Arial,Helvetica,sans-serif;color:#334155;
}
.wrapper{width:100%;padding:40px 15px}
.container{
 width:100%;max-width:600px;margin:auto;background:#fff;
 border-radius:22px;overflow:hidden;
 box-shadow:0 30px 60px rgba(0,0,0,.17);
}
.header{
 padding:45px 25px;text-align:center;color:#fff;
 background:linear-gradient(135deg,#16a34a,#22c55e);
 box-shadow:inset 0 -12px 25px rgba(0,0,0,.12);
}
.icon{
 font-size:52px;display:inline-block;
 animation:float 3s infinite;
}
.header h1{font-size:30px;margin:15px 0 0}
.content{padding:45px}
.card{
 padding:25px;border-radius:18px;
 background:#f0fdf4;
 box-shadow:9px 9px 22px rgba(0,0,0,.1);
 border-left:5px solid #22c55e;
}
.card p{font-size:16px;line-height:1.6}
.footer{
 padding:25px;text-align:center;
 background:#f1f5f9;color:#64748b;font-size:13px;
}
@keyframes float{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-9px)}
}
@media(max-width:600px){
 .wrapper{padding:15px 8px}
 .header{padding:32px 20px}
 .header h1{font-size:25px}
 .content{padding:25px 18px}
 .card{padding:18px}
}
</style>
</head>

<body>
<div class="wrapper">
<div class="container">

<div class="header">
<div class="icon">✅</div>
<h1>Appointment Confirmed</h1>
</div>

<div class="content">
<h2>Hello {{customerName}}</h2>
<p>Your appointment has been successfully confirmed.</p>

<div class="card">
<p><b>Service:</b> {{serviceName}}</p>
<p><b>Date:</b> {{appointmentDate}}</p>
<p><b>Time:</b> {{appointmentTime}}</p>
</div>

<p>Thank you for choosing us.</p>
</div>

<div class="footer">
{{companyName}}<br>{{supportEmail}}
</div>

</div>
</div>
</body>
</html>
