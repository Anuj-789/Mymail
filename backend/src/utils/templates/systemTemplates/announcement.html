<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Announcement</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#ede9fe;
 font-family:Arial,Helvetica,sans-serif;color:#334155;
}
.wrapper{width:100%;padding:40px 15px}
.container{
 width:100%;max-width:600px;margin:auto;background:#fff;
 border-radius:22px;overflow:hidden;
 box-shadow:0 30px 60px rgba(0,0,0,.18);
}
.header{
 padding:45px 25px;text-align:center;color:white;
 background:linear-gradient(135deg,#9333ea,#ec4899);
 box-shadow:inset 0 -12px 25px rgba(0,0,0,.12);
}
.icon{
 font-size:52px;display:inline-block;
 animation:float 3s ease-in-out infinite;
}
.header h1{font-size:30px;margin:15px 0 0}
.content{padding:45px}
.card{
 padding:25px;border-radius:18px;
 background:#faf5ff;
 box-shadow:9px 9px 22px rgba(0,0,0,.1);
}
.card h2{margin-top:0;color:#581c87}
.button-wrap{text-align:center;margin:35px 0}
.button{
 display:inline-block;padding:16px 35px;border-radius:50px;
 background:linear-gradient(135deg,#9333ea,#ec4899);
 color:#fff!important;text-decoration:none;font-weight:bold;
 box-shadow:0 12px 25px rgba(147,51,234,.35);
}
.footer{
 padding:25px;text-align:center;background:#f8fafc;
 color:#64748b;font-size:13px;
}
@keyframes float{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-10px)}
}
@media(max-width:600px){
 .wrapper{padding:15px 8px}
 .header{padding:32px 20px}
 .header h1{font-size:25px}
 .content{padding:25px 18px}
 .card{padding:20px}
 .button{display:block}
}
</style>
</head>

<body>
<div class="wrapper">
<div class="container">

<div class="header">
<div class="icon">📢</div>
<h1>{{title}}</h1>
</div>

<div class="content">
<div class="card">
<h2>Hello {{userName}}</h2>
<p>{{message}}</p>
</div>

<div class="button-wrap">
<a href="{{actionLink}}" class="button">View Details</a>
</div>
</div>

<div class="footer">
© {{companyName}}
</div>

</div>
</div>
</body>
</html>
