<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Password Reset</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fef2f2;font-family:Arial;color:#334155}
.wrapper{width:100%;padding:40px 15px}
.container{
 width:100%;max-width:600px;margin:auto;background:#fff;
 border-radius:22px;overflow:hidden;
 box-shadow:0 30px 60px rgba(0,0,0,.18);
}
.header{
 background:linear-gradient(135deg,#dc2626,#ef4444);
 padding:45px 25px;color:#fff;text-align:center;
 box-shadow:inset 0 -12px 25px rgba(0,0,0,.15);
}
.header h1{font-size:29px}
.content{padding:45px}
.button-wrap{text-align:center;margin:35px 0}
.button{
 display:inline-block;padding:16px 35px;border-radius:50px;
 background:linear-gradient(135deg,#dc2626,#ef4444);
 color:#fff!important;text-decoration:none;font-weight:bold;
 box-shadow:0 12px 25px rgba(220,38,38,.4);
}
.footer{background:#f1f5f9;padding:25px;text-align:center;color:#64748b}
@media(max-width:600px){
 .wrapper{padding:15px 8px}
 .header{padding:32px 20px}
 .content{padding:25px 18px}
 .button{display:block}
}
</style>
</head>

<body>
<div class="wrapper">
<div class="container">

<div class="header">
<h1>🔑 {{appName}}</h1>
</div>

<div class="content">
<h2>Hello {{userName}}</h2>
<p>We received a request to reset your password.</p>
<p>Click below to create a new password.</p>

<div class="button-wrap">
<a href="{{resetLink}}" class="button">Reset Password</a>
</div>

<p>If you did not request this, ignore this email.</p>
<p>{{supportEmail}}</p>
</div>

<div class="footer">
© {{companyName}}
</div>

</div>
</div>
</body>
</html>
