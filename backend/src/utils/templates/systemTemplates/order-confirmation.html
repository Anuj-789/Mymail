<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order Confirmation</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#eff6ff;font-family:Arial;color:#334155}
.wrapper{width:100%;padding:40px 15px}
.container{
 width:100%;max-width:600px;margin:auto;background:#fff;
 border-radius:22px;overflow:hidden;
 box-shadow:0 30px 60px rgba(0,0,0,.17);
}
.header{
 background:linear-gradient(135deg,#2563eb,#06b6d4);
 padding:45px 25px;text-align:center;color:#fff;
 box-shadow:inset 0 -12px 25px rgba(0,0,0,.12);
}
.icon{font-size:52px;animation:float 3s infinite}
.header h1{font-size:30px}
.content{padding:45px}
.order{
 background:#eff6ff;padding:25px;border-radius:18px;
 box-shadow:9px 9px 22px rgba(0,0,0,.1);
 border-left:5px solid #2563eb;
}
.order p{line-height:1.5}
.footer{background:#f1f5f9;padding:25px;text-align:center;color:#64748b}
@keyframes float{50%{transform:translateY(-9px)}}
@media(max-width:600px){
 .wrapper{padding:15px 8px}
 .header{padding:32px 20px}
 .header h1{font-size:25px}
 .content{padding:25px 18px}
 .order{padding:18px}
}
</style>
</head>

<body>
<div class="wrapper">
<div class="container">

<div class="header">
<div class="icon">📦</div>
<h1>Order Confirmed</h1>
</div>

<div class="content">
<h2>Hello {{customerName}}</h2>
<p>Your order has been confirmed successfully.</p>

<div class="order">
<p><b>Order ID:</b> {{orderId}}</p>
<p><b>Product:</b> {{productName}}</p>
<p><b>Amount:</b> {{amount}}</p>
<p><b>Date:</b> {{orderDate}}</p>
</div>
</div>

<div class="footer">{{companyName}}</div>

</div>
</div>
</body>
</html>
