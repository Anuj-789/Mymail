<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payment Success</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#ecfdf5;font-family:Arial;color:#334155}
.wrapper{width:100%;padding:40px 15px}
.container{
 width:100%;max-width:600px;margin:auto;background:#fff;
 border-radius:22px;overflow:hidden;
 box-shadow:0 30px 60px rgba(0,0,0,.17);
}
.header{
 background:linear-gradient(135deg,#16a34a,#22c55e);
 padding:45px 25px;text-align:center;color:#fff;
 box-shadow:inset 0 -12px 25px rgba(0,0,0,.12);
}
.header h1{font-size:29px}
.content{padding:45px}
.box{
 background:#f0fdf4;padding:25px;border-radius:18px;
 border-left:5px solid #22c55e;
 box-shadow:9px 9px 22px rgba(0,0,0,.1);
}
.box p{line-height:1.5;word-break:break-word}
.footer{padding:25px;background:#f1f5f9;text-align:center;color:#64748b}
@media(max-width:600px){
 .wrapper{padding:15px 8px}
 .header{padding:32px 20px}
 .header h1{font-size:24px}
 .content{padding:25px 18px}
 .box{padding:18px}
}
</style>
</head>

<body>
<div class="wrapper">
<div class="container">

<div class="header">
<h1>💳 Payment Successful</h1>
</div>

<div class="content">
<h2>Hello {{customerName}}</h2>
<p>Your payment has been received successfully.</p>

<div class="box">
<p><b>Transaction ID:</b> {{transactionId}}</p>
<p><b>Amount:</b> {{amount}}</p>
<p><b>Payment Method:</b> {{paymentMethod}}</p>
</div>
</div>

<div class="footer">
{{companyName}}<br>{{supportEmail}}
</div>

</div>
</div>
</body>
</html>
