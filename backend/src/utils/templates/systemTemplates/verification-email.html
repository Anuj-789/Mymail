<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Email Verification</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#ecfdf5;font-family:Arial;color:#334155}
.wrapper{width:100%;padding:40px 15px}
.container{
 width:100%;max-width:600px;margin:auto;background:#fff;
 border-radius:22px;overflow:hidden;
 box-shadow:0 30px 60px rgba(0,0,0,.18);
}
.header{
 background:linear-gradient(135deg,#16a34a,#22c55e);
 padding:45px 25px;text-align:center;color:#fff;
 box-shadow:inset 0 -12px 25px rgba(0,0,0,.12);
}
.icon{
 font-size:52px;display:inline-block;
 animation:float 3s infinite;
}
.header h1{font-size:30px}
.content{padding:45px}
.button-wrap{text-align:center;margin:35px 0}
.button{
 display:inline-block;padding:16px 35px;border-radius:50px;
 background:linear-gradient(135deg,#16a34a,#22c55e);
 color:#fff!important;text-decoration:none;font-weight:bold;
 box-shadow:0 12px 25px rgba(34,197,94,.4);
}
.footer{
 background:#f1f5f9;padding:25px;text-align:center;
 font-size:13px;color:#64748b;
}
@keyframes float{50%{transform:translateY(-10px)}}
@media(max-width:600px){
 .wrapper{padding:15px 8px}
 .header{padding:32px 20px}
 .header h1{font-size:25px}
 .content{padding:25px 18px}
 .button{display:block}
}
</style>
</head>

<body>
<div class="wrapper">
<div class="container">

<div class="header">
<div class="icon">✉️</div>
<h1>{{appName}}</h1>
</div>

<div class="content">
<h2>Hello {{userName}}</h2>

<p>
Thank you for creating your account.
Please verify your email address to activate your account.
</p>

<div class="button-wrap">
<a href="{{verificationLink}}" class="button">Verify Email</a>
</div>

<p>If you did not create this account, ignore this email.</p>

<p>Support: {{supportEmail}}</p>
</div>

<div class="footer">
© {{companyName}}
</div>

</div>
</div>
</body>
</html>
