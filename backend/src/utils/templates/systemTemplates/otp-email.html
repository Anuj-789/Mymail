<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OTP Verification</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f3ff;font-family:Arial;color:#334155}
.wrapper{width:100%;padding:40px 15px}
.container{
 width:100%;max-width:600px;margin:auto;background:#fff;
 border-radius:22px;overflow:hidden;
 box-shadow:0 30px 60px rgba(0,0,0,.18);
}
.header{
 background:linear-gradient(135deg,#7c3aed,#c084fc);
 padding:45px 25px;text-align:center;color:#fff;
 box-shadow:inset 0 -12px 25px rgba(0,0,0,.12);
}
.content{padding:45px;text-align:center}
.otp{
 display:block;
 padding:22px 15px;
 margin:25px 0;
 border-radius:16px;
 background:#f5f3ff;
 color:#7c3aed;
 font-size:38px;
 font-weight:bold;
 letter-spacing:12px;
 box-shadow:
   inset 5px 5px 15px rgba(0,0,0,.08),
   0 10px 20px rgba(124,58,237,.12);
 word-break:break-all;
}
.footer{background:#f1f5f9;padding:25px;text-align:center}
@media(max-width:600px){
 .wrapper{padding:15px 8px}
 .header{padding:32px 20px}
 .content{padding:30px 18px}
 .otp{font-size:28px;letter-spacing:7px;padding:18px 8px}
}
</style>
</head>

<body>
<div class="wrapper">
<div class="container">

<div class="header">
<h1>{{appName}}</h1>
</div>

<div class="content">
<h2>Hello {{userName}}</h2>
<p>Your verification OTP is:</p>

<div class="otp">{{otp}}</div>

<p>Expires in {{expiryTime}}</p>
<p><b>Do not share this OTP.</b></p>
</div>

<div class="footer">
© {{companyName}}
</div>

</div>
</div>
</body>
</html>
