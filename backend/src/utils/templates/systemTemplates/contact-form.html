<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact Form</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#eff6ff;
 font-family:Arial,Helvetica,sans-serif;color:#334155;
}
.wrapper{width:100%;padding:40px 15px}
.container{
 width:100%;max-width:600px;margin:auto;background:#fff;
 border-radius:22px;overflow:hidden;
 box-shadow:0 30px 60px rgba(0,0,0,.17);
}
.header{
 padding:45px 25px;text-align:center;color:#fff;
 background:linear-gradient(135deg,#2563eb,#06b6d4);
}
.icon{font-size:52px}
.content{padding:45px}
.message-box{
 padding:25px;border-radius:18px;
 background:#f8fafc;
 border-left:5px solid #2563eb;
 box-shadow:8px 8px 20px rgba(0,0,0,.1);
 line-height:1.7;
 word-break:break-word;
}
.footer{
 padding:25px;text-align:center;
 background:#f1f5f9;color:#64748b;font-size:13px;
}
@media(max-width:600px){
 .wrapper{padding:15px 8px}
 .header{padding:32px 20px}
 .header h1{font-size:25px}
 .content{padding:25px 18px}
 .message-box{padding:18px}
}
</style>
</head>

<body>
<div class="wrapper">
<div class="container">

<div class="header">
<div class="icon">💬</div>
<h1>New Contact Message</h1>
</div>

<div class="content">
<h3>From: {{name}}</h3>
<p>Email: {{email}}</p>

<div class="message-box">
{{message}}
</div>

<p>Please respond as soon as possible.</p>
</div>

<div class="footer">
{{companyName}}<br>{{supportEmail}}
</div>

</div>
</div>
</body>
</html>
