<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Password Reset</title>


<style>

body{
margin:0;
padding:0;
background:#f4f7fb;
font-family:Arial,sans-serif;
}


.container{

width:600px;

margin:40px auto;

background:white;

border-radius:12px;

overflow:hidden;

}


.header{

background:#dc2626;

color:white;

padding:30px;

text-align:center;

}


.content{

padding:40px;

color:#333;

}


.button{

display:inline-block;

padding:14px 30px;

background:#dc2626;

color:white;

text-decoration:none;

border-radius:8px;

}


.footer{

background:#f1f5f9;

padding:20px;

text-align:center;

font-size:13px;

color:#64748b;

}

</style>


</head>


<body>


<div class="container">


<div class="header">

<h1>
{{appName}}
</h1>

</div>



<div class="content">


<h2>
Hello {{userName}},
</h2>



<p>

We received a request to reset your password.

</p>



<p>

Click the button below to create a new password.

</p>



<div style="text-align:center;margin:30px 0;">


<a href="{{resetLink}}"
class="button">

Reset Password

</a>


</div>



<p>

If you did not request this password reset, ignore this email.

</p>


<p>

{{supportEmail}}

</p>


</div>



<div class="footer">


<p>
© {{companyName}}
</p>


</div>



</div>


</body>


</html>
