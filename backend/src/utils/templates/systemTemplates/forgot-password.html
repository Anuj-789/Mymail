<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Password Reset</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fff1f2;font-family:Arial;color:#334155}
.wrapper{width:100%;padding:40px 15px}
.container{
 width:100%;max-width:600px;margin:auto;background:#fff;
 border-radius:22px;overflow:hidden;
 box-shadow:0 30px 65px rgba(0,0,0,.18);
}
.header{
 padding:45px 25px;text-align:center;color:#fff;
 background:linear-gradient(135deg,#dc2626,#f43f5e);
 box-shadow:inset 0 -12px 25px rgba(0,0,0,.15);
}
.icon{
 font-size:52px;display:inline-block;
 animation:float 3s infinite;
}
.content{padding:45px}
.button-wrap{text-align:center;margin:35px 0}
.button{
 display:inline-block;padding:16px 40px;border-radius:50px;
 background:linear-gradient(135deg,#dc2626,#f43f5e);
 color:#fff!important;text-decoration:none;font-weight:bold;
 box-shadow:0 12px 28px rgba(220,38,38,.4);
}
.warning{
 padding:20px;border-radius:16px;
 background:#fff1f2;border-left:5px solid #dc2626;
}
.footer{padding:25px;text-align:center;background:#f1f5f9}
@keyframes float{50%{transform:translateY(-10px)}}
@media(max-width:600px){
 .wrapper{padding:15px 8px}
 .header{padding:32px 20px}
 .header h1{font-size:25px}
 .content{padding:25px 18px}
 .button{display:block}
}
</style>
</head>

<body>
<div class="wrapper">
<div class="container">

<div class="header">
<div class="icon">🔐</div>
<h1>{{appName}}</h1>
</div>

<div class="content">
<h2>Hello {{userName}}</h2>
<p>We received a request to reset your password.</p>

<div class="button-wrap">
<a href="{{resetLink}}" class="button">Reset Password</a>
</div>

<div class="warning">
If you did not request this password reset, ignore this email.
</div>

<p>{{supportEmail}}</p>
</div>

<div class="footer">© {{companyName}}</div>

</div>
</div>
</body>
</html>
